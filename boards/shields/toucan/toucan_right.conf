CONFIG_ZMK_POINTING=y

CONFIG_I2C=y
CONFIG_INPUT_TPS43=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we
# have pressed a keyboard key within the last 30 seconds (highly likely).
CONFIG_ZMK_IDLE_TIMEOUT=30000

CONFIG_INPUT_THREAD_STACK_SIZE=2048

# BLE split (ZMK_SPLIT_BLE) depends on ZMK_BLE, and a split peripheral has no
# HID-over-GATT need, so nothing enables it: without this the half builds with
# no split transport at all. Harmless on zmk v0.3, where it is already on.
CONFIG_ZMK_BLE=y

# zmk v0.3 shipped app/boards/seeeduino_xiao_ble.conf with all of this; on main
# the board is upstream Zephyr's xiao_ble, which sets none of it. Without FLASH
# the NVS settings backend silently falls back to SETTINGS_NONE and bluetooth
# bonds are forgotten at every reset; the storage partition (0xec000, 32K) comes
# from nrf52840_partition_uf2_sdv7.dtsi, which xiao_ble already includes.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Same file: the console is off in release builds on this board.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_SERIAL=n
